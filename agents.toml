schema = "ag.agent-config.v1"
project = "agautolab"

[models."ollama/qwen3.6:35b-a3b-coding-nvfp4"]

[models."anthropic/claude-sonnet-5"]

[profiles.local]
harness = "agcode"
model = "ollama/qwen3.6:35b-a3b-coding-nvfp4"

[profiles.sonnet]
harness = "claude_code"
model = "anthropic/claude-sonnet-5"

[profiles.stub]
harness = "fake"
model = "ollama/qwen3.6:35b-a3b-coding-nvfp4"

[roles.front]
profile = "local"
requires = ["nested_harness"]

[roles.director]
profile = "sonnet"
requires = []

[roles.mediator]
profile = "sonnet"
requires = []

[roles.coding]
profile = "sonnet"
requires = []

# Reads the whole project — main/, direction/, devlog/ — to plan one mission.
# On `local` while the reworked mission flow is exercised (2026-08-18); put it
# back on the strongest profile once the flow is trusted.
[roles.superdirector]
profile = "local"
requires = []

[roles.summarizer]
profile = "sonnet"
requires = []

[capabilities]
provides = ["nested_harness", "service_http"]
