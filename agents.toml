schema = "ag.agent-config.v2"
project = "agautolab"

[models."ollama/qwen3.8:27b-mlx-bf16"]

[models."anthropic/claude-sonnet-5"]

[models."google/gemini-2.5-flash"]

[profiles.local]
harness = "agcode"
model = "ollama/qwen3.8:27b-mlx-bf16"

[profiles.sonnet]
harness = "claude_code"
model = "anthropic/claude-sonnet-5"

[profiles.stub]
harness = "fake"
model = "ollama/qwen3.8:27b-mlx-bf16"

# Google's Gemini CLI, headless. Selectable per project (autolab:
# `.local/projects/<p>/agents.toml`) or in the instance overlay; the CLI
# resolves its own key and reports tokens but no cost, so a gemini run's
# record carries `usage` only. `gemini-2.5-flash` is the model that answered
# on 2026-09-04 while the default model returned 503 all day.
[profiles.gemini]
harness = "gemini_cli"
model = "google/gemini-2.5-flash"

# The instance entrance, and the gateway window. On `sonnet` since
# `agent_standardize` p10: the `local` profile cost more than it saved,
# and `nested_harness` was a requirement of the in-process backend it
# used, not of the role.
# Every role carries its own tool grant (claude_code's --allowedTools) since
# ag.agent-config.v2; a role without one is a schema error, not a run that
# waits on a permission prompt until the timeout. The working grant is one
# string of thought repeated per role below, so a permission fix must land
# on every role that does work — `front` runs `uv run new_mission.py` in its
# own workspace and needs the same shell as `mediator`; `director` records
# notes into the direction clone; `coding`/`superdirector`/`supercoder`
# write files.
[roles.front]
profile = "sonnet"
requires = []
allowed_tools = [
    "Read", "Write", "Edit", "Glob", "Grep", "TodoWrite", "BashOutput", "KillShell",
    "WebFetch", "WebSearch", "NotebookEdit",
    "Bash(git:*)", "Bash(uv:*)", "Bash(uvx:*)", "Bash(curl:*)", "Bash(wget:*)",
    "Bash(node:*)", "Bash(npm:*)", "Bash(npx:*)", "Bash(python3:*)", "Bash(pip:*)",
    "Bash(jq:*)", "Bash(autolab:*)",
    "Bash(ls:*)", "Bash(cat:*)", "Bash(head:*)", "Bash(tail:*)", "Bash(wc:*)",
    "Bash(sort:*)", "Bash(find:*)", "Bash(rg:*)", "Bash(sed:*)", "Bash(awk:*)",
    "Bash(mkdir:*)", "Bash(cp:*)", "Bash(mv:*)", "Bash(rm:*)", "Bash(chmod:*)",
    "Bash(touch:*)", "Bash(date:*)", "Bash(pwd:*)", "Bash(cd:*)", "Bash(which:*)",
    "Bash(env:*)", "Bash(sleep:*)", "Bash(kill:*)", "Bash(ps:*)", "Bash(echo:*)",
    "Bash(open:*)", "Bash(tar:*)", "Bash(make:*)", "Bash(bash:*)", "Bash(sh:*)",
    # How a run reaches another agent. `tools/agents.md` says who is there;
    # this is what lets a run write to them.
    "Bash(agentchat:*)",
]

