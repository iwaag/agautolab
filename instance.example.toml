# Copy to .local/instance.toml and set the real name.
#
# <agent>-<instance label><N>: the label is the host this instance runs on,
# the number distinguishes instances sharing a host. This is the name the
# Zulip account, the instance's own channel and its intro-<name> topic all
# use.
#
# Only a placement that runs the Zulip listener needs this file; a
# gateway-only node is not addressable and stays unnamed.
#
# Local-only because the label is host information (devdocs/README_DEV.md).
name = "autolab-<host><N>"
