[project]
name = "agautolab"
version = "0.1.0"
description = "The executor of WFE workflow runs and its Zulip transports"
requires-python = ">=3.11"
dependencies = [
    "pyagag",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agautolab"]

[tool.uv.sources]
pyagag = { git = "https://github.com/iwaag/pyagag.git", branch = "main" }
