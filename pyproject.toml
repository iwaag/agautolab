[project]
name = "agautolab"
version = "0.1.0"
description = "Headless auto-development loop orchestrator (autolab)"
requires-python = ">=3.11"
dependencies = [
    "pyagag",
    "pyyaml>=6.0",
]

[project.scripts]
autolab = "agautolab.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agautolab"]

[tool.uv.sources]
pyagag = { git = "https://github.com/iwaag/pyagag.git", branch = "main" }
